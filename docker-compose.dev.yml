services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: aitrader
      POSTGRES_PASSWORD: aitrader
      POSTGRES_DB: aitrader
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aitrader -d aitrader']
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
  redis-data:
